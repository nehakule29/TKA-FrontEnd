<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
</head>
<body>
    <h3>Customer Name</h3>
    <form>
        <label for="CustomerName"> Customer Name</label>
        <input type="text" id="CustomerName" required  placeholder="Enter your name here"><br><br>
        <label for="email" > Email </label>
        <input type="email" id="email" required placeholder="Enter email id"><br><br>
        <label for="ProductName">Product Name</label>
        <input type="text" id="ProductName" placeholder="Enter product name"><br><br>
        <label for="Rating">Rating</label>
        <input type="radio" name="star">1 Star
        <input type="radio" name="star">2 Stars
        <input type="radio" name="star"> 3 Stars
        <input type="radio" name="star">4 stars
        <input type="radio" name="star">5 Stars
        <br><br>
        <label for="Review" >Review</label>
        <textarea id="Review"></textarea><br><br>
        <label for="Reccommend">Recommend Product</label>
        <input type="checkbox" id="Reccommend"><br><br>
        <input type="Submit">

    </form>
</body>
</html>
