<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Table Booking</title>
</head>
<body>
    <h3>Restaurant Table Booking</h3>
    <form style="text-align: justify;background-color: rgb(22, 150, 255);">
    <label for="CustomerName">Customer Name</label>
        <input type="text" id="CustomerName" placeholder="Enter your name" required><br><br>
    <label for="Mobile">Mobilee</label>
    <input type="tel" pattern="[0-9]{10}" required placeholder="Enter your Mobile number"><br><br>
     <label for="email"> Email : </label>
    <input type="email" id="email"><br/><br>
   <label for="date"> Date
   </label>
   <input type="date" id="date"><br><br>
   <label for="time">Time</label>
   <input type="time" id="time"><br><br>
   <label for="NoGuests">Number of Guests</label>
   <input type="number" placeholder="Enter number of guests" max="20"><br><br>
   <lable for="SeatingPreference">Seating Preference</lable>
   <input type="radio" name="seating" id="rooftop">Rooftop
   <input type="radio" name="seating" id="Window">Window
   <input type="radio" name="seating" id="CenterTop">Center Top<br><br>
   <label for="request">Special Request</label>
   <textarea id="request"></textarea><br><br>
   <input type="submit" value="Reserve Table" style="background-color: rgb(193, 149, 84);">
   </form>
</body>
</html>
