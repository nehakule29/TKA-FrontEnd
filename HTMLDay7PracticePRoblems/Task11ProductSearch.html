<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search</title>
</head>
<body>
    <h3>Product Search</h3>
    <form>
        <label for="SearchProduct">Search Product</label>
        <input type="text" id="SearchProduct"><br><br>
        <label for="Category"> Category </label>&nbsp;&nbsp;
        <select id="Catgory">
        <option id="elect">Electronics</option>
        <option id="cloth">Clothing</option>
        <option id="mobil">Mobiles</option>
        <option id="lapto">Laptops</option>
        <option id="shoes">Shoes</option>
        <option id="books">Books</option>
        </select>
        <br><br>
        <label for="Brand"> Brand</label>&nbsp;&nbsp;
        <select id="brand">
        <option id="lenov">Lenovo</option>
        <option id="acer">Acer</option>
        <option id="Dell">Dell</option>
        <option id="Asus">Asus</option>
        </select>
        <br><br>
        <label for="MinimumPrice">Minimum Price</label>&nbsp;&nbsp;
        <input type="number" id="MinimumPrice" value="min">&nbsp;&nbsp;&nbsp;&nbsp;
        <label for="MaximumPrice">Maximum Price</label>&nbsp;&nbsp;
        <input type="number" id="MAximumPrice" value="max"><br><br>
        <input type="submit" value="Search">
        
    </form>
</body>
</html>
