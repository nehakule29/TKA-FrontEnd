<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>
</head>
<body>
    <h3>Colllege Admission Form</h3>
    <form>
        <h5>Personal Information</h5><br>
        <label for="Name">Name</label>
        <input type="text" id="Name" placeholder="Enter your name here" required><br><br>
        <label for="DOB">DOB</label>
        <input type="date" id="DOB" required><br><br>
        <label for="Gender">Gender</label>
        <input type="radio" name="gender" id="Male">Male    
        <input type="radio" name="gender" id="Female">Female<br><br>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email here" required><br><br>
        <label for="Mobile">Mobile</label>
        <input type="tel" pattern="[0-9]{10}" placeholder="Enter your phone here" required><br><br>
        <h5>Academic Information</h5><br>
        <label for="SSC">10th Marks</label>
        <input type="number" id="SSC" pattern="[0-9]{2}" placeholder="Enter your 10th marks here" required><br><br>
        <label for="HSC">12th Marks</label>
        <input type="number" id="HSC" pattern="[0-9]{2}" placeholder="Enter your 12th marks here" required><br><br>
        <label for="Qualification">Qualification</label>
        <input type="text" id="Qualification" placeholder="Enter your qualification here" required><br><br>
        <label for="Passing Year">Passing Year</label>
        <input type="number" id="Passing Year" pattern="[0-9]{4}" placeholder="Enter your passing year here" required><br><br>
        <h5>Course Information</h5><br>
        <label for="Course">Course</label>
        <select name="Course" id="Course">
            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="B.Tech">B.Tech</option>
            <option value="MCA">MCA</option>
            <option value="MBA">MBA</option>
        </select><br><br>
        <label for="Branch">Branch</label>
        <input type="text" id="Branch" placeholder="Enter your branch here" required><br><br>
        <label for="Admission Type">Admission Type</label>
        <select name="Admission Type" id="Admission Type">
            <option value="Regular">Regular</option>
            <option value="Distance">Distance</option>
        </select><br><br>
        <h5>Address</h5><br>
        <label for="Address">Address</label>
        <textarea id="Address" placeholder="Enter your address here" required></textarea><br><br>
        <label for="City">City</label>
        <input type="text" id="City">
        <label for="State">State</label>
        <input type="text" id="State"><br><br>
        <label for="Pincode">Pincode</label>
        <input type="number" id="Pincode" pattern="[0-9]{6}" placeholder="Enter your pincode here" required><br><br>
        <h5>Other Information</h5><br>
        <label for="Hobbies">Hobbies</label>
        <input type="text" id="Hobbies" placeholder="Enter your hobbies here" required><br><br>
        <label for="Skills">Skills</label>
        <input type="text" id="Skills" placeholder="Enter your skills here" required autocomplete><br><br>
        <label for="Documents">Documents</label>
        <input type="file" id="Documents"><br><br>
        <input type="checkbox" id="T&C"><label for="T&C">I agree to the Terms and conditions</label><br><br>
        
    </form>
</body>
</html>
