<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    
</head>
<body>
    <h3>Login Form</h3>
    <form>
        <input type="text"id="username" placeholder="Enter Username/Email" required><br/><br/>
        <input type="password" id="password" placeholder="Enter username" required><br/><br/>
        <input type="checkbox" id="check">
        <label for="check">Remember me</label><br/><br/>
        <input type="button" onclick="alert('Hello World')" id="login" value="Login">
        <input type="reset" id="reset" value="Reset"><br/><br/>

    </form>
</body>
</html>
