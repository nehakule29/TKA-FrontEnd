<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>

</head>
<body>
    <h3>Feedback Form</h3>
    <form style="align-items: right;">
        <label for="Full Name">Full Name : </label>
        <input type="text" required id="FullNAme"><br/> <br/>
        <label for="email">Email :      </label>
        <input type="email" id="email" required><br/> <br/>
        <label for="experience">Overall Experience</label>
        <input type="radio" id="Excellent" name="experience" value="Excellent">
        <input type="radio" id="Good" name="experience" value="Good">
        <input type="radio" id="Average" name="experience" value="Average">
        <input type="radio" id="Poor" name="experience" value="Poor"></br></br>
        <input type="checkbox" id="check">
        <label for="check">Service used </label><br/><br/>
        <textarea placeholder="Enter comments">Enter comments</textarea>
        <br/>
        <button type="submit" id="submit" value="submit">Submit</button>
        <input type="reset" id="reset" value="Reset"><br/><br/>

    </form>
</body>
</html>
