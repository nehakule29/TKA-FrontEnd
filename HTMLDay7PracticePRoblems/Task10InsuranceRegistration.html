<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Registration</title>
</head>
<body>
    <h3>
        Insurance Registration Form
    </h3>
    <form>
    <label for="CustomerName">Customer NAme</label>
    <input type="text" id="CustomerName" required><br><br>
    <label for="age"> Age </label>&nbsp;&nbsp;
    <input type="number" id="age"><br><br>
    <label for="gender">Gender </label>
    <input type="radio" name="gender" id="MAle">Male
    <input type="radio" name="gender" id="female">Female
    <input type="radio" name="gender" id="Others">Others<br><br>
    <label for="email"> Email : </label>
    <input type="email" id="email"><br/><br>
    <label for="Mobile">Mobile No.</label>&nbsp;&nbsp;
    <input type="tel"  pattern="[0-9]{10}" id="Mobile"><br><br>
    <label for="InsuranceType">Insurance Type </label>
    <input type="radio" name="type" id="Health">Health
    <input type="radio" name="type" id="Life">Life
    <input type="radio" name="type" id="Vehicle">Vehicle
    <input type="radio" name="type" id="Travel">Travel
    <br><br> 
    <label for="Occupation"> Occupation </label>&nbsp;&nbsp;
    <input type="text" id="Occupation"><br><br>
      <label for="city"> City </label>&nbsp;&nbsp;
    <input type="text" id="city"><br><br>
    <label for="message">Message </label>&nbsp;&nbsp;
    <textarea id="message"></textarea><br><br>
    <button type="submit"> Submit </button>
    </form>

</body>
</html>
