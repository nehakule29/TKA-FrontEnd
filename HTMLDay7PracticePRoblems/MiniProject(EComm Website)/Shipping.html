<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Page</title>
</head>
<body>
    <h3>Shipping Form</h3>
    <form>
        <label>Name </label>
        <input type="text" id="name" placeholder="Enter your name"><br><br>
        <label for="Mobile">Mobile
        </label>
        <input type="tel" pattern="[0-9]{10}" placeholder="Enter your phone here" required><br><br>
         <label for="address">Address</label>
            <textarea id="address" name="address" placeholder="Enter your address" required></textarea><br><br>

            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Enter city" ><br><br>

            <label for="state">State</label>
            <input type="text" id="state" name="state" placeholder="Enter state"><br><br>

            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode"
                   placeholder="Enter pincode" maxlength="6" ><br><br>


    </form>
</body>
</html>
