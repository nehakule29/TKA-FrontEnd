<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>
<body>
    <h3>Feedback</h3>
    <form>
        <label for="Name">Name </label>
        <input type="text" id="Name" placeholder="Enter your name"><br><br>
        <label for="Email">Email </label>
        <input type="email" id="Email" placeholder="Enter your email"><br><br>
        <label for="Rating">Rating </label>
        <input type="radio" name="Rating">1
        <input type="radio" name="Rating">2
        <input type="radio" name="Rating">3
        <input type="radio" name="Rating">4
        <input type="radio" name="Rating">5 
        <br><br>
        <label for="Review">Review </label>
        <textarea id="Review" name="Review" placeholder="Enter your review"></textarea><br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
