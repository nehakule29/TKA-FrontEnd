<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
</head>
<body>
    <h3>Payment Method</h3>
    <form>
        <label for="PaymentMethod">Payment Method</label>
        <input type="radio" name="PaymentMethod">UPI
        <input type="radio" name="PaymentMethod">Card
        <input type="radio" name="PaymentMethod">COD
        <br><br>
        <label for="Details">Card/UPI details</label>
        <input type="radio" name="Details"><input type="text" placeholder="Enter UPI ID" value="UPI">
        <input type="radio" name="Details"><input type="text" placeholder="Enter Card Details" value="Card">
        <br><br>
        <input type="checkbox" id="T&C"><label for="T&C">Terms & Conditions</label>
        <input type="submit" value="Place Order"><br>
    </form>

</body>
</html>
