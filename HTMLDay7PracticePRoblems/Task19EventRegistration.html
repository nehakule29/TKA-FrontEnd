<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>
</head>
<body>
    <h3 style="text-align: center; background-color: rgb(158, 114, 114);">Register for our event here!</h3>
    <form style="text-align: center; background-color: rgb(136, 114, 158);">
        <label for="ParticpantName">Participant's Name</label>
        <input type="text" id="ParticipantName" placeholder="Enter your name here" required><br><br>
        <label for="email">Email </label>
        <input type="email" id="email" placeholder="Enter your email here" required><br><br>
        <label for="Mobile">Mobile
        </label>
        <input type="tel" pattern="[0-9]{10}" placeholder="Enter your phone here" required><br><br>
        <label for="EventType">Event Type</label>
        <input type="text" disabled value="Hackathon"><br><br>
        <label for="date">Date </label>
        <input type="date" id="date" required><br><br>
        <label for="ParticipantNo.">Number of Participants</label>
        <input type="number" max="4" id="ParticipantNo."><br><br>
        <label for="ParticipationType">Participation Type</label>
        <input type="radio" name="type" id="Individual">Individual
        <input type="radio" name="type" id="Team">Team<br><br>
        <input type="checkbox" id="T&C"><label for="T&C">I agree to the terms and conditions</label><br><br>
        <input type="submit" value="Register" style="background-color: rgb(blue);">
    </form> 
</body>
</html>
