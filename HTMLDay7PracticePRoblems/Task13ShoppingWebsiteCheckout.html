<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Form</title>

</head>

<body>

    <div class="checkout-container">

        <h2>Shopping Checkout</h2>

        <form>

            <label for="name">Customer Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br><br><br>

            <label for="mobile">Mobile</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required><br><br>

            <label for="address">Address</label>
            <textarea id="address" name="address" placeholder="Enter your address" required></textarea><br><br>

            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Enter city" ><br><br>

            <label for="state">State</label>
            <input type="text" id="state" name="state" placeholder="Enter state"><br><br>

            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode"
                   placeholder="Enter pincode" maxlength="6" ><br><br>

            <label>Payment Method</label>

                <label>
                    <input type="radio" name="payment" value="credit-card" required>
                    Credit Card
                </label>

                <label>
                    <input type="radio" name="payment" value="debit-card">
                    Debit Card
                </label>

                <label>
                    <input type="radio" name="payment" value="upi">
                    UPI
                </label>

                <label>
                    <input type="radio" name="payment" value="cash-on-delivery">
                    Cash on Delivery
                </label><br><br>


            <button type="submit" >
                Place Order
            </button>

        </form>

    </div>

</body>
</html>
