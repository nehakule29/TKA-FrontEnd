<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form>
        <label for="Name">Name : </label>
        <input type="text" id="name" placeholder="Enter your Full NAme" required><br/><br/>
        <label for="email">Email : </label>
        <input type="email" id="email"><br/><br/>
        <label for="password">Password : </label>
        <input type="password" id="password" placeholder="Enter password"><br/><br/>
        <label for="mobile">Mobile Number : </label>
        <input type="tel" id="mobile" pattern="[0-9]{10}"><br/><br/>
        <label for="Age">Age : </label>
        <input type="number" max="100"><br/><br/>
        <label for="gender">Gender : </label>
        <input type="radio" id="Male" name="gender" value="Male">
        <input type="radio" id="female" name="gender" value="Female"><br/><br/>
        <label for="courses">Course : </label>
        <select id="courses">
            <option id="CS" name="courses">
                Computer Science
            </option>
            <option id="IT" name="courses">IT</option>
            <option id="E&TC" name="courses">E&TC</option>
            <option id="Mechanical" name="courses">Mechanical</option>
        </select><br/><br/>
        <label for="address">Address : </label>
        <input type="textarea" id="address"><br/><br/>
        <label for="skills">Skills : </label>
        <input type="textarea"><br/><br/>


    </form>
</body>
</html>
