<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Address</title>

</head>
<body>
    <h3>Shipping Addreess Form</h3>
    <label for="FullName"> Full Name </label>
    <input type="text" id="FullName" placeholder="Enter your name here"><br><br>
    <label for="Mobile">Mobile No. </label>
    <input type="tel" pattern="[0-9]{10}" id="Mobile" rquired placeholder="Enter here"> <br><br>
    <label type="text" id="House">House/Building </label>
    <input type="text" id="House" placeholder="Enter House No./Building Name"><br><br>
    <label for="Street">Street </label>
    <input type="text" placeholder="Enter Street Name here" required><br><br>
    <label for="State">State </label>
    <input type="text" id="State" placeholder="Enter your state"><br><br>
    <label for="Pincode">Pincode </label>
    <input type="number" pattern="[0-9]{6}" placeholder="Enter pincode here"><br><br>
    <label for="type">Address Type</label>
    <input type="radio" name="address" id="Home">Home
    <input type="radio" name="address" id="Office">Office

</body>
</html>
