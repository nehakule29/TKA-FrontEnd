<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Feedback</title>
</head>
<body>
    <h3>
        HR Feedback Form
    </h3>
    <form>
    <label for="EmpName">Employee Name</label>
    <input type="text" id="EmpName"><br><br>
    <label for="Department"> Department </label>
    <input type="radio" name="Department">BFSI
    <input type="radio" name="Department">Infra & Finanance
    <input type="radio" name="Department">IT
    <input type="radio" name="Department">Hr
    <br/><br/>
    <label for="JobSatisfaction">Job Satisfaction
    </label>
    <input type="radio" name="JobSatisfaction">Very Satisfied
    <input type="radio" name="JobSatisfaction">Satisfied
    <input type="radio" name="JobSatisfaction">Neutral
    <input type="radio" name="JobSatisfaction">Dissatisfied
    <input type="radio" name="JobSatisfaction">Very Dissatisfied
    <br/><br/>
    <label for="WorkEnvironment">Work Environment</label>
    <input type="radio" name="WorkEnvironment">Excellent
    <input type="radio" name="WorkEnvironment">Good
    <input type="radio" name="WorkEnvironment">Average
    <input type="radio" name="WorkEnvironment">Poor
    <br/><br/>
    <label for="ManagementSupport">Management Support</label>
    <input type="radio" name="ManagementSupport">Excellent
    <input type="radio" name="ManagementSupport">Good
    <input type="radio" name="ManagementSupport">Average
    <input type="radio" name="ManagementSupport">Poor
    <br/><br/>
    <label for="TrainingSatisfaction">Training Satisfaction</label>
    <input type="radio" name="TrainingSatisfaction">Excellent
    <input type="radio" name="TrainingSatisfaction">Good
    <input type="radio" name="TrainingSatisfaction">Average
    <input type="radio" name="TrainingSatisfaction">Poor
    <br/><br/>
    <label for="Suggestions">Suggestions</label>
    <textarea id="Suggestions" name="Suggestions"></textarea>   
    <input type="checkbox" id="Feedback">I agree to provide feedback</input><br><br>
    <input type="submit" value="Submit">
    </form>
</body>
</html>
